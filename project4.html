<!DOCTYPE html>
<html lang="en">
<head>

  <title>Crypto-Arsenal</title>
  <link rel="icon" href="assets/images/favicon.png" type="image/x-icon" />

<body class="work-page">
  <header class="navbar">
    <div class="navbar-glass" aria-hidden="true"></div>

      <div class="nav-left">
        <button class="hamburger" id="hamburger" aria-label="Open navigation">&#9776;</button>

      </div>
      <nav class="nav-links" id="nav-links">
        <a href="index.html" class="nav-link work">WORK</a>
        <a href="about.html" class="nav-link about">ABOUT</a>
      </nav>
    </div>
  </header>

  <section class="banner">
    <!-- Add the banner image to assets/images/NycuAR/banner.png -->
    <img src="assets/images/Crypto-Arsenal/banner.png" alt="Crypto-Arsenal" class="banner-image" />
    <div class="banner-overlay">
      <div class="banner-layout">
        <div class="banner-content">
          <div class="banner-header">
            <h1 class="project-title">Crypto-Arsenal</h1>
            <div class="project-tags" aria-label="Project categories">

    <div id="overview" class="content-block">
      <img src="assets/images/Crypto-Arsenal/dashboard.png" alt="Crypto-Arsenal dashboard" class="project-image" />
